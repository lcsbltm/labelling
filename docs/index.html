<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Label Printing Platform API</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.0/swagger-ui.css">
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.0/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      dom_id: "#swagger-ui",
      url: "/openapi.yaml",
      validatorUrl: null,
      requestInterceptor(request) {
        const url = new URL(request.url, window.location.href);
        if (request.method === "POST" && url.origin === window.location.origin && url.pathname === "/v1/print-jobs") {
          request.headers["X-Requested-By"] = "local-developer";
        }
        return request;
      }
    });
  </script>
</body>
</html>
